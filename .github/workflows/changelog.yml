name: Changelog

# Every pull request says what it changes in CHANGELOG.md, under "Unreleased". A separate workflow
# from CI so that adding or removing the "no changelog" label runs the check again.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changelog:
    # CI-only changes, typo fixes and Dependabot's action updates carry no entry.
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'no changelog')
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check that CHANGELOG.md is updated
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          if git diff --name-only "origin/$BASE...HEAD" | grep --quiet --line-regexp "CHANGELOG.md"; then
            echo "CHANGELOG.md is updated."
          else
            echo "::error file=CHANGELOG.md::Add a line under 'Unreleased' in CHANGELOG.md saying what this pull request changes, or label it 'no changelog' if it changes nothing people would notice. See docs/contributing/releases.md."
            exit 1
          fi
