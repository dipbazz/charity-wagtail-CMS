name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Check for missing migrations
        run: uv run python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: charity.settings.test

      - name: Django deployment checklist
        run: uv run python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: charity.settings.production
          DJANGO_SECRET_KEY: ci-only-${{ github.run_id }}-not-a-real-secret-key-padding-for-length
          DJANGO_ALLOWED_HOSTS: example.org

      - name: Test
        run: uv run pytest --cov --cov-report=term-missing:skip-covered
