name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Check for missing migrations
        run: uv run python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: charity.settings.test

      - name: Django deployment checklist
        run: uv run python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: charity.settings.production
          DJANGO_SECRET_KEY: ci-only-${{ github.run_id }}-not-a-real-secret-key-padding-for-length
          DJANGO_ALLOWED_HOSTS: brightwell.example
          DJANGO_SITE_URL: https://brightwell.example

      - name: Install Chromium for the browser tests
        run: uv run playwright install --with-deps chromium

      - name: Test
        run: uv run pytest --cov --cov-report=term-missing:skip-covered

  lighthouse:
    runs-on: ubuntu-latest
    env:
      # Production settings, as deployed, with the demo content in a throwaway data directory.
      DJANGO_SETTINGS_MODULE: charity.settings.production
      DJANGO_SECRET_KEY: ci-only-${{ github.run_id }}-not-a-real-secret-key-padding-for-length
      DJANGO_ALLOWED_HOSTS: 127.0.0.1
      DJANGO_SITE_URL: http://127.0.0.1:8000
      DJANGO_DATA_DIR: /tmp/charity-data
      DJANGO_SERVE_MEDIA: "true"
      # The seeded Brightwell demo is English-first, like the demo server.
      DJANGO_LANGUAGE_CODE: en
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Load the demo site
        run: |
          mkdir -p "$DJANGO_DATA_DIR"
          uv run python manage.py migrate --noinput
          uv run python manage.py seed_demo
          uv run python manage.py collectstatic --noinput

      - name: Start the site with gunicorn, as in the Docker image
        run: |
          uv run --with gunicorn==25.1.0 gunicorn charity.wsgi:application             --bind 127.0.0.1:8000 --workers 2 --daemon
          # Visit each page once so image renditions exist before anything is measured.
          for path in / /appeals/ /appeals/flood-relief/ /news/; do
            curl --silent --show-error --fail --retry 10 --retry-connrefused               --header "X-Forwarded-Proto: https" --output /dev/null "http://127.0.0.1:8000$path"
          done

      # Budgets live in lighthouserc.json. Reports go to an artifact, not to a public server.
      - name: Check page weight and layout shift on a phone
        run: npx --yes @lhci/cli@0.15.1 autorun

      - name: Keep the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports
          if-no-files-found: ignore

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install the docs dependencies
        run: uv sync --locked --only-group docs

      # Warnings are errors, so a broken link between pages or a page left out of the table of
      # contents fails the pull request.
      - name: Build the docs
        run: uv run --no-sync sphinx-build -W --keep-going docs docs/_build/html

      # Not published anywhere yet (it depends on whether the repo stays public), so every
      # run's docs can be downloaded and read from here.
      - name: Keep the built docs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-html
          path: docs/_build/html

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build --tag charity-cms .

      # The image must run production settings; dev settings fail this check.
      - name: Django deployment checklist inside the image
        run: >
          docker run --rm
          --env DJANGO_SECRET_KEY=ci-only-${{ github.run_id }}-not-a-real-secret-key-padding-for-length
          --env DJANGO_ALLOWED_HOSTS=brightwell.example
          --env DJANGO_SITE_URL=https://brightwell.example
          charity-cms python manage.py check --deploy --fail-level WARNING

      # deploy/aws/: the compose file and the Caddyfile both parse.
      - name: Check the AWS deployment config
        working-directory: deploy/aws
        env:
          SITE_HOST: ci.brightwell.example
          DJANGO_SECRET_KEY: ci-only-not-a-real-secret
        run: |
          docker compose config --quiet
          docker compose run --rm --no-deps caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      # compose.yaml at the root: the site on your own computer.
      - name: Check the local Docker config
        run: docker compose config --quiet
