# The workflows pin every action to a commit SHA, which never changes by itself.
# Dependabot opens a pull request when an action has a new release, updating the SHA and the
# version comment together, so pinned actions don't fall behind on fixes.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # One pull request for all action updates in a week, rather than one per action.
      github-actions:
        patterns: ["*"]
