# The workflows pin every action to a commit SHA, and the deployment pins its images to a digest;
# neither ever changes by itself.
# Dependabot opens a pull request when one has a new release, updating the pin and the version
# together, so pinned actions and images don't fall behind on fixes.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # One pull request for all action updates in a week, rather than one per action.
      github-actions:
        patterns: ["*"]

  # The Caddy image in the AWS deployment is pinned to a digest for the same reason.
  - package-ecosystem: "docker-compose"
    directory: "/deploy/aws"
    schedule:
      interval: "weekly"
