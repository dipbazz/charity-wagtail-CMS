[project]
name = "charity-cms"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "phonenumbers>=9.0.40",
    "wagtail>=8.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=8.0.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.16.9",
    "wagtail-factories>=4.5.0",
]
docs = [
    "myst-parser>=5.1.0",
    "sphinx>=9.1.0",
    "sphinx-autobuild>=2025.8.25",
    "sphinx-llms-txt>=0.7.1",
    "sphinx-wagtail-theme>=6.6.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "charity.settings.test"
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
filterwarnings = [
    # Wagtail 8.0 still calls the email API deprecated in Django 6.1; not fixable from our code.
    "ignore:get_connection:django.utils.deprecation.RemovedInDjango70Warning:wagtail.admin.mail",
]

[tool.coverage.run]
source = ["."]
omit = ["*/migrations/*", "*/tests/*", ".venv/*", "manage.py", "charity/wsgi.py", "charity/settings/*"]

[tool.ruff]
line-length = 100
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.ruff.lint.per-file-ignores]
"charity/settings/*" = ["F403", "F405"]
