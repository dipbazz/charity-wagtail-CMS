{% load wagtailcore_tags wagtailimages_tags %}
<article class="card news-card">
    {% if story.hero_image %}{% image story.hero_image fill-640x360 %}{% endif %}
    <div class="card-body">
        <p class="meta"><time datetime="{{ story.date|date:'Y-m-d' }}">{{ story.date|date:"j F Y" }}</time></p>
        <h2><a href="{% pageurl story %}">{{ story.title }}</a></h2>
        <p>{{ story.introduction }}</p>
    </div>
</article>
