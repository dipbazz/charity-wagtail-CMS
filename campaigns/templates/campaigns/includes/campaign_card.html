{% load wagtailcore_tags wagtailimages_tags %}
<article class="card campaign-card">
    {% if campaign.hero_image %}{% image campaign.hero_image fill-640x360 %}{% endif %}
    <div class="card-body">
        <h3><a href="{% pageurl campaign %}">{{ campaign.title }}</a></h3>
        <p>{{ campaign.summary }}</p>
        {% include "campaigns/includes/progress.html" %}
        {% if not campaign.is_active %}<p class="meta">This appeal has closed.</p>{% endif %}
    </div>
</article>
