{% load money_tags %}
<div class="campaign-progress">
    <p class="meta"><strong>{% money campaign.amount_raised %} raised of {% money campaign.target_amount %}</strong></p>
    <div class="progress" role="progressbar" aria-label="Fundraising progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{ campaign.progress_percent }}">
        <div class="progress-bar" style="width: {{ campaign.progress_percent }}%"></div>
    </div>
</div>
